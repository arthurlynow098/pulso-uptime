name: status

# roda a cada 6 horas e publica a página de status no GitHub Pages
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checar sites
        run: python -m pulso sites.json --historico docs/historico.json --pagina docs/index.html || true
      - name: Salvar resultado
        run: |
          git config user.name "pulso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "status: atualiza página"
          git push
